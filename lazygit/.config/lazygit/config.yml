---
git:
  autoForwardBranches: none
  diffRenderers:
    - type: rawGit
    - command: difft --color=always --display=inline
      type: extDiff
gui:
  nerdFontsVersion: "3"
  showDivergenceFromBaseBranch: arrowAndNumber
  theme:
    selectedLineBgColor:
      - "#45403d"
    searchingActiveBorderColor:
      - "bold"
    optionsTextColor:
      - "#a9b665"
    defaultFgColor:
      - "#d4be98"
    cherryPickedCommitFgColor:
      - "#a9b665"
    cherryPickedCommitBgColor:
      - "#7daea3"
    activeBorderColor:
      - "bold"
    unstagedChangesColor:
      - "#ea6962"
keybinding:
  universal:
    suspendApp: <disabled>
    redo: <ctrl+z>
    newWorktree: <disabled>
customCommands:
  - key: '<ctrl+v>'
    context: 'files'
    command: git diff --staged | llm -t conventional-commit | git commit -e -F -
    description: 'Commit with AI'
    output: terminal
  - key: 'b'
    description: 'Absorb staged changes into past commits'
    commandMenu:
      - key: 'b'
        context: 'files'
        command: git absorb
        description: 'Absorb (create fixup commits only)'
        output: terminal
      - key: 'B'
        context: 'files'
        command: git absorb --and-rebase
        description: 'Absorb and rebase (autosquash)'
        output: terminal
      - key: 'w'
        context: 'files'
        command: git absorb --whole-file
        description: 'Absorb whole-file (create fixup commits only)'
        output: terminal
      - key: 'W'
        context: 'files'
        command: git absorb --whole-file --and-rebase
        description: 'Absorb whole-file and rebase (autosquash)'
        output: terminal
      - key: 'n'
        context: 'files'
        command: git absorb --dry-run
        description: 'Dry run (preview)'
        output: terminal
  # Worktrees panel: workmux overrides lazygit's native worktree actions
  - key: 'n'
    context: 'worktrees'
    command: 'workmux add -o "{{.Form.Branch}}"'
    description: 'New worktree + tmux window (workmux)'
    prompts:
      - type: 'input'
        title: 'Branch name'
        key: 'Branch'
    output: terminal
  - key: '<space>'
    context: 'worktrees'
    command: 'workmux open "{{.SelectedWorktree.Name}}"'
    description: 'Open worktree in tmux (workmux)'
    output: terminal
  - key: 'd'
    context: 'worktrees'
    command: 'workmux remove "{{.SelectedWorktree.Name}}"'
    description: 'Remove worktree + tmux window + branch (workmux)'
    output: terminal
  - key: 'w'
    description: 'workmux'
    commandMenu:
      # --- local branches ---
      - key: 'o'
        context: 'localBranches'
        command: >-
          name=$(workmux list --json | jq -r --arg b "{{.SelectedLocalBranch.Name}}"
          '.[] | select(.branch==$b) | .handle'); if [ -n "$name" ]; then workmux
          open "$name"; else echo "No worktree found for branch {{.SelectedLocalBranch.Name}}";
          fi
        description: 'Open this branch worktree in tmux'
        output: terminal
      - key: 'a'
        context: 'localBranches'
        command: 'workmux add -o "{{.SelectedLocalBranch.Name}}"'
        description: 'Add worktree for this branch + tmux window'
        output: terminal
      - key: 'm'
        context: 'localBranches'
        command: 'workmux merge "{{.SelectedLocalBranch.Name}}"'
        description: 'Merge this branch + cleanup worktree'
        output: terminal
      - key: 'd'
        context: 'localBranches'
        command: >-
          name=$(workmux list --json | jq -r --arg b "{{.SelectedLocalBranch.Name}}"
          '.[] | select(.branch==$b) | .handle'); if [ -n "$name" ]; then workmux
          remove "$name"; else echo "No worktree found for branch {{.SelectedLocalBranch.Name}}";
          fi
        description: 'Remove this branch worktree + tmux window + branch'
        output: terminal
      - key: 'n'
        context: 'localBranches'
        command: >-
          workmux add -o "{{.Form.Branch}}" --base "{{.SelectedLocalBranch.Name}}"
        description: 'New branch + worktree'
        prompts:
          - type: 'input'
            title: 'New branch name (branch is off of ''{{.SelectedLocalBranch.Name}}'')'
            key: 'Branch'
        output: terminal
      # --- remote branches ---
      - key: 'a'
        context: 'remoteBranches'
        command: >-
          workmux add -o "{{.SelectedRemoteBranch.RemoteName}}/{{.SelectedRemoteBranch.Name}}"
        description: 'Add worktree tracking this remote branch'
        output: terminal
      # --- tags ---
      - key: 'a'
        context: 'tags'
        command: 'workmux add -o "{{.Form.Branch}}" --base "{{.SelectedTag.Name}}"'
        description: 'New worktree from this tag'
        prompts:
          - type: 'input'
            title: 'New branch name (from tag {{.SelectedTag.Name}})'
            key: 'Branch'
            initialValue: '{{.SelectedTag.Name}}'
        output: terminal
      # --- commits / sub-commits / reflog ---
      - key: 'a'
        context: 'commits'
        command: 'workmux add -o "{{.Form.Branch}}" --base "{{.SelectedCommit.Hash}}"'
        description: 'New worktree from this commit'
        prompts:
          - type: 'input'
            title: 'New branch name (from commit {{.SelectedCommit.Hash}})'
            key: 'Branch'
        output: terminal
      - key: 'a'
        context: 'subCommits'
        command: 'workmux add -o "{{.Form.Branch}}" --base "{{.SelectedCommit.Hash}}"'
        description: 'New worktree from this commit'
        prompts:
          - type: 'input'
            title: 'New branch name (from commit {{.SelectedCommit.Hash}})'
            key: 'Branch'
        output: terminal
      - key: 'a'
        context: 'reflogCommits'
        command: 'workmux add -o "{{.Form.Branch}}" --base "{{.SelectedCommit.Hash}}"'
        description: 'New worktree from this commit'
        prompts:
          - type: 'input'
            title: 'New branch name (from commit {{.SelectedCommit.Hash}})'
            key: 'Branch'
        output: terminal
      # --- stash ---
      - key: 'a'
        context: 'stash'
        command: >-
          workmux add -o "{{.Form.Branch}}" --base "stash@{{"{"}}{{.SelectedStashEntry.Index}}{{"}"}}"
        description: 'New worktree from this stash'
        prompts:
          - type: 'input'
            title: 'New branch name (from stash)'
            key: 'Branch'
        output: terminal
