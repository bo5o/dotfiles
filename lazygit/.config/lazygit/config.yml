---
git:
  autoForwardBranches: none
  pagers:
    - useExternalDiffGitConfig: false # default pager
    - externalDiffCommand: difft --color=always --display=inline
gui:
  nerdFontsVersion: "3"
  showDivergenceFromBaseBranch: arrowAndNumber
  theme:
    selectedLineBgColor:
      - "#45403d"
    searchingActiveBorderColor:
      - "bold"
    optionsTextColor:
      - "#a9b665"
    defaultFgColor:
      - "#d4be98"
    cherryPickedCommitFgColor:
      - "#a9b665"
    cherryPickedCommitBgColor:
      - "#7daea3"
    activeBorderColor:
      - "bold"
    unstagedChangesColor:
      - "#ea6962"
keybinding:
  universal:
    suspendApp: <disabled>
    redo: <ctrl+z>
customCommands:
  - key: '<ctrl+v>'
    context: 'files'
    command: git diff --staged | llm -t conventional-commit | git commit -e -F -
    description: 'Commit with AI'
    output: terminal
  - key: 'b'
    description: 'Absorb staged changes into past commits'
    commandMenu:
      - key: 'b'
        context: 'files'
        command: git absorb
        description: 'Absorb (create fixup commits only)'
        output: terminal
      - key: 'B'
        context: 'files'
        command: git absorb --and-rebase
        description: 'Absorb and rebase (autosquash)'
        output: terminal
      - key: 'w'
        context: 'files'
        command: git absorb --whole-file
        description: 'Absorb whole-file (create fixup commits only)'
        output: terminal
      - key: 'W'
        context: 'files'
        command: git absorb --whole-file --and-rebase
        description: 'Absorb whole-file and rebase (autosquash)'
        output: terminal
      - key: 'n'
        context: 'files'
        command: git absorb --dry-run
        description: 'Dry run (preview)'
        output: terminal
  - key: 'W'
    description: 'workmux'
    commandMenu:
      - key: 'a'
        context: 'worktrees'
        command: 'workmux add -o "{{.Form.Branch}}"'
        description: 'Add worktree + tmux window'
        prompts:
          - type: 'input'
            title: 'Branch name'
            key: 'Branch'
        output: terminal
      - key: 'o'
        context: 'worktrees'
        command: 'workmux open "{{.SelectedWorktree.Name}}"'
        description: 'Open worktree in tmux'
        output: terminal
      - key: 'm'
        context: 'worktrees'
        command: 'workmux merge "{{.SelectedWorktree.Name}}"'
        description: 'Merge worktree + cleanup'
        output: terminal
      - key: 'd'
        context: 'worktrees'
        command: 'workmux remove "{{.SelectedWorktree.Name}}"'
        description: 'Remove worktree + tmux window + branch'
        output: terminal
      - key: 'a'
        context: 'localBranches'
        command: 'workmux add -o "{{.SelectedLocalBranch.Name}}"'
        description: 'Add worktree for this branch + tmux window'
        output: terminal
      - key: 'm'
        context: 'localBranches'
        command: 'workmux merge "{{.SelectedLocalBranch.Name}}"'
        description: 'Merge this branch + cleanup worktree'
        output: terminal
      - key: 'd'
        context: 'localBranches'
        command: >-
          name=$(workmux list --json | jq -r --arg b "{{.SelectedLocalBranch.Name}}"
          '.[] | select(.branch==$b) | .handle'); if [ -n "$name" ]; then workmux
          remove "$name"; else echo "No worktree found for branch {{.SelectedLocalBranch.Name}}";
          fi
        description: 'Remove this branch worktree + tmux window + branch'
        output: terminal
      - key: 'n'
        context: 'localBranches'
        command: 'workmux add -o "{{.Form.Branch}}"'
        description: 'New branch + worktree'
        prompts:
          - type: 'input'
            title: 'New branch name'
            key: 'Branch'
        output: terminal
