[tools."http:ncdu"]
version = "2.9.1"
url = "https://dev.yorhel.nl/download/ncdu-{{ version }}-linux-x86_64.tar.gz"
checksum_url = "https://dev.yorhel.nl/download/ncdu-{{ version }}-linux-x86_64.tar.gz.sha256"
version_list_url = "https://dev.yorhel.nl/ncdu"
version_regex = 'ncdu-(2\.[0-9.]+)-linux-x86_64\.tar\.gz'

[tools."pipx:ansible"]
version = "14.3.1"
uvx_args = """
--with-executables-from ansible-core
--with-executables-from ansible-dev-tools
--with-executables-from ansible-lint
--with-requirements /usr/local/share/dotfiles/mise/pipx/ansible.txt
"""

[settings]
experimental = true
env_shell_expand = true
disable_backends = ["asdf"]
use_versions_host = false

[settings.python]
compile = true
uv_venv_create_args = ['--seed']
