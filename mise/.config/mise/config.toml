[tools."pipx:ansible"]
version = "14.3.1"
uvx_args = """
--with-executables-from ansible-core
--with-executables-from ansible-dev-tools
--with-executables-from ansible-lint
--with-requirements {{ xdg_config_home }}/mise/pipx/ansible.txt
"""

[settings]
experimental = true
env_shell_expand = true
disable_backends = ["asdf"]
use_versions_host = false

[settings.python]
compile = true
uv_venv_create_args = ['--seed']
